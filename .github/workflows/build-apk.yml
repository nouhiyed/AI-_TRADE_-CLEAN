name: Build AI Trade APK
# V3-only CI: test backend contracts before producing the Android artifact.

# Rebuild trigger: refresh the Android APK pipeline.

concurrency:
  group: ai-trade-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - 'agents/**'
      - 'core/**'
      - 'api/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/build-apk.yml'
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'agents/**'
      - 'core/**'
      - 'api/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies, compile and run regression tests
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q agents api core tests
          python -m unittest discover -s tests -v

  live-market-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_TRADER_WS_MAX_SYMBOLS: '250'
      AI_TRADER_WS_WARMUP_WORKERS: '4'
      AI_TRADER_ANALYSIS_WORKERS_PER_MARKET: '4'
      AI_TRADER_RECONCILE_BATCH_SIZE: '96'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile live backend
        run: python -m compileall -q core agents api scripts
      - name: Verify both Binance markets complete all 500 exact-cycle analyses
        run: python -u scripts/live_binance_cycle_smoke.py
# APK compilation is gated by code regression tests. Live Binance verification remains
# a separate strict diagnostic: hosted-runner geographic restrictions (HTTP 451)
# must not be mistaken for an app build failure. Device connectivity is validated
# against Binance from the supported Android/Termux environment. LIVE stays locked.
  build:
    needs: [backend-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --project-name ai_trade .

      - name: Install persistent Android background service
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/ai_trade
          cp android_templates/MainActivity.kt android/app/src/main/kotlin/com/example/ai_trade/MainActivity.kt
          cp android_templates/TradingKeepAliveService.kt android/app/src/main/kotlin/com/example/ai_trade/TradingKeepAliveService.kt

      - name: Configure Maven Central mirror and Gradle dependency cache
        working-directory: mobile
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          source = settings.read_text()
          mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          if mirror not in source:
              match = re.search(r"(?m)^(\s*)repositories\s*\{", source)
              if not match:
                  raise SystemExit("ERROR: pluginManagement repositories block not found")
              insert_at = match.end()
              source = source[:insert_at] + "\n" + match.group(1) + "    " + mirror + source[insert_at:]
              settings.write_text(source)
          print("Maven Central mirror added before plugin repositories")

          build = Path("android/build.gradle.kts")
          if build.exists():
              source = build.read_text()
              if mirror not in source:
                  match = re.search(r"(?m)^(\s*)repositories\s*\{", source)
                  if match:
                      insert_at = match.end()
                      source = source[:insert_at] + "\n" + match.group(1) + "    " + mirror + source[insert_at:]
                      build.write_text(source)
          PYTHON

      - name: Setup Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Soulaymen AI Trading launcher branding
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values
          cp android_templates/res/drawable/ic_launcher_foreground.xml android/app/src/main/res/drawable/
          cp android_templates/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/
          cp android_templates/res/values/ic_launcher_background.xml android/app/src/main/res/values/
          python3 -m pip install --quiet Pillow
          mkdir -p android/app/src/main/res/drawable-nodpi
          python3 - <<'PYTHON'
          from pathlib import Path
          from PIL import Image
          source = Path("assets/images/app_logo.jpg")
          if not source.is_file():
              raise SystemExit(f"ERROR: required app logo is missing: {source}")
          image = Image.open(source).convert("RGBA")
          foreground = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          logo = image.copy()
          logo.thumbnail((340, 340), Image.Resampling.LANCZOS)
          foreground.alpha_composite(logo, ((432 - logo.width) // 2, (432 - logo.height) // 2))
          foreground.save("android/app/src/main/res/drawable-nodpi/ic_launcher_logo.png")
          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          for density, size in sizes.items():
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(folder / "ic_launcher.png")
          Path("android/app/src/main/res/drawable/ic_launcher_foreground.xml").write_text(
              '<bitmap xmlns:android="http://schemas.android.com/apk/res/android" '
              'android:src="@drawable/ic_launcher_logo" android:gravity="center" />\n'
          )
          print("Generated launcher icons from Soulaymen AI Trading logo")
          PYTHON
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s, count = re.subn(r'android:label="[^"]*"', 'android:label="Soulaymen AI Trading"', s, count=1)
          if count != 1:
              raise SystemExit("ERROR: Android app label was not found")
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              s = re.sub(r'<application\b', '<application android:icon="@mipmap/ic_launcher"', s, count=1)
          p.write_text(s)
          print("Soulaymen AI Trading app label and adaptive icon configured")
          PYTHON

      - name: Configure Gradle distribution download
        working-directory: mobile
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          s = p.read_text()
          url = r"distributionUrl=https\\://mirror.nju.edu.cn/gradle/gradle-9.5.0-bin.zip"
          s, count = re.subn(r"(?m)^distributionUrl=.*$", url, s)
          if count != 1:
              raise SystemExit("ERROR: Expected one Gradle distributionUrl")
          checksum = "distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746"
          if re.search(r"(?m)^distributionSha256Sum=", s):
              s = re.sub(r"(?m)^distributionSha256Sum=.*$", checksum, s)
          else:
              s = s.rstrip() + "\n" + checksum + "\n"
          p.write_text(s)
          print("Gradle 9.5.0 BIN download configured")
          PYTHON

      - name: Configure Android network access
        working-directory: mobile
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
              '<uses-permission android:name="com.termux.permission.RUN_COMMAND" />',
          ]
          for permission in permissions:
              if permission not in s:
                  s = s.replace("<application", permission + "\n    <application", 1)
          if 'android:name="com.termux"' not in s:
              s = s.replace(
                  "<application",
                  '    <queries>\n        <package android:name="com.termux" />\n    </queries>\n    <application',
                  1,
              )
          match = re.search(r'<application\b[^>]*', s)
          if not match:
              raise SystemExit("ERROR: application tag not found")
          tag = match.group(0)
          if "android:usesCleartextTraffic=" not in tag:
              s = s[:match.end()] + ' android:usesCleartextTraffic="true"' + s[match.end():]
          service = """        <service
              android:name=".TradingKeepAliveService"
              android:enabled="true"
              android:exported="false"
              android:foregroundServiceType="specialUse">
              <property
                  android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                  android:value="Keeps AI-Trader market monitoring and risk monitoring active while the app is in the background" />
          </service>
          """
          if 'android:name=".TradingKeepAliveService"' not in s:
              s = s.replace("</application>", service + "    </application>", 1)
          p.write_text(s)
          print("Android network permissions configured")
          PYTHON

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Enforce the single backend port
        run: |
          OLD_PORT="$(printf '%s' '80')$(printf '%s' '00')"
          if grep -RInE "127\\.0\\.0\\.1:\\${OLD_PORT}|localhost:\\${OLD_PORT}|AI_TRADER_PORT[^#]*\\${OLD_PORT}" api mobile README.md; then
            echo "ERROR: obsolete backend port reference found"
            exit 1
          fi
          echo "Verified: only the configured backend port 8001 remains"

      - name: Build APK with retries
        working-directory: mobile
        run: |
          for attempt in 1 2 3; do
            echo "APK build attempt $attempt of 3"
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting 20 seconds before retry..."
              sleep 20
            fi
          done
          echo "ERROR: APK build failed after 3 attempts"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trade-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  publish-result:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: write
    steps:
      - name: Publish build result and APK artifact ID on commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId
            });
            const apk = artifacts.data.artifacts.find(
              item => item.name === 'AI-Trade-APK' && !item.expired
            );
            const build = '${{ needs.build.result }}';
            const success = build === 'success' && Boolean(apk);
            const description = apk
              ? `APK artifact ID: ${apk.id}; run: ${context.runId}`
              : `Build ${success ? 'succeeded' : 'failed'}; run: ${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'AI-Trade APK build',
              description: description.slice(0, 140),
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
            });

# Trigger a fresh release APK build for the latest main-branch application state.
