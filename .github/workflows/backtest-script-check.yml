name: V3 backtest script checks

on:
  pull_request:
    paths:
      - 'scripts/backtest_v3_2y.py'
      - 'tests/test_backtest_v3.py'
      - '.github/workflows/backtest-script-check.yml'
  push:
    paths:
      - 'scripts/backtest_v3_2y.py'
      - 'tests/test_backtest_v3.py'
      - '.github/workflows/backtest-script-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Compile backtest script
        run: python -m py_compile scripts/backtest_v3_2y.py
      - name: Run backtest helper tests
        run: python -m unittest tests/test_backtest_v3.py -v
