name: Scalping V3 Two-Year Historical Backtest

on:
  push:
    branches: [main]
    paths:
      - 'scripts/backtest_scalping_v3_2y.py'
      - '.github/workflows/backtest-v3-2y.yml'
  workflow_dispatch:
    inputs:
      days:
        description: Historical test window in days
        required: true
        default: '730'
      markets:
        description: Markets to test
        required: true
        default: 'spot,futures'

permissions:
  contents: read

concurrency:
  group: scalping-v3-two-year-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DAYS: ${{ github.event.inputs.days || '730' }}
      MARKETS: ${{ github.event.inputs.markets || 'spot,futures' }}
      SYMBOLS: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,LINKUSDT
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests ta matplotlib
      - name: Validate historical backtest script
        run: python -m py_compile scripts/backtest_scalping_v3_2y.py
      - name: Run two-year historical simulation
        run: python scripts/backtest_scalping_v3_2y.py
      - name: Upload results and chart screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trader-V3-2Y-Backtest
          path: |
            backtest-results/
            AI-Trader-V3-Backtest-Charts.zip
          if-no-files-found: warn
          retention-days: 30
