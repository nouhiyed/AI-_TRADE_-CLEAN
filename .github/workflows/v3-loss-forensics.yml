name: V3 Loss Forensics (read-only)

on:
  push:
    branches: [research/v3-loss-forensics]
    paths:
      - scripts/loss_forensics_v3.py
      - tests/test_loss_forensics_v3.py
      - .github/workflows/v3-loss-forensics.yml
  workflow_dispatch:
    inputs:
      symbols:
        description: Futures symbols
        required: true
        default: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,LINKUSDT

permissions:
  contents: read

concurrency:
  group: v3-loss-forensics
  cancel-in-progress: true

jobs:
  forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip "pandas>=2.2,<3" numpy pytest requests
      - name: Run forensic unit tests
        run: PYTHONPATH=. python -m pytest tests/test_loss_forensics_v3.py -q
      - name: Download official Binance Vision 5m candles
        env:
          SYMBOLS: ${{ github.event.inputs.symbols || 'BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,LINKUSDT' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import io, os, zipfile, time
          from datetime import timedelta
          from pathlib import Path
          import pandas as pd, requests
          start=pd.Timestamp("2024-11-16T00:00:00Z")
          end=pd.Timestamp.now(tz="UTC").floor("D")
          cache=Path("data/backtest_cache"); cache.mkdir(parents=True,exist_ok=True)
          cols=["open_time","open","high","low","close","volume","close_time","quote_volume","trades","taker_buy_base","taker_buy_quote","ignore"]
          s=requests.Session(); s.headers["User-Agent"]="AI-Trader-Loss-Forensics/1.0"
          def get(symbol,period,cadence):
            url=f"https://data.binance.vision/data/futures/um/{cadence}/klines/{symbol}/5m/{symbol}-5m-{period}.zip"
            for attempt in range(5):
              r=s.get(url,timeout=90)
              if r.status_code==404: raise RuntimeError("Missing archive "+url)
              if r.status_code in (418,429) or r.status_code>=500:
                time.sleep(min(30,2**(attempt+1))); continue
              r.raise_for_status()
              with zipfile.ZipFile(io.BytesIO(r.content)) as z:
                n=next(x for x in z.namelist() if x.lower().endswith(".csv"))
                d=pd.read_csv(z.open(n),header=None)
              if str(d.iloc[0,0]).lower() in ("open_time","open time"): d=d.iloc[1:]
              d=d.iloc[:,:12]; d.columns=cols[:d.shape[1]]
              for c in ("open_time","close_time","open","high","low","close","volume"): d[c]=pd.to_numeric(d[c],errors="coerce")
              return d.dropna(subset=["open_time","close_time","open","high","low","close","volume"])[["open_time","open","high","low","close","volume","close_time"]]
            raise RuntimeError("Download retries exhausted "+url)
          # Download only the daily candles that overlap actual trades.
          artifact_url="https://api.github.com/repos/nouhiyed/AI-_TRADE_-CLEAN/actions/artifacts/14927189129/zip"
          headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["GH_TOKEN"]}
          response=s.get(artifact_url,headers=headers,timeout=90); response.raise_for_status()
          with zipfile.ZipFile(io.BytesIO(response.content)) as z:
            trade_name=next(n for n in z.namelist() if n.endswith("trades_demo_aligned.csv"))
            trades=pd.read_csv(z.open(trade_name),parse_dates=["entry_time","exit_time"])
          trades["entry_time"]=pd.to_datetime(trades.entry_time,utc=True)
          trades["exit_time"]=pd.to_datetime(trades.exit_time,utc=True)
          for sym in [x.strip().upper() for x in os.environ["SYMBOLS"].split(",") if x.strip()]:
            subset=trades[trades.symbol==sym]
            days=set()
            for row in subset.itertuples():
              for day in pd.date_range(row.entry_time.floor("D"),row.exit_time.floor("D"),freq="D"):
                days.add(day.date())
            parts=[get(sym,day,"daily") for day in sorted(days)]
            d=pd.concat(parts,ignore_index=True).drop_duplicates("open_time").sort_values("open_time") if parts else pd.DataFrame(columns=["open_time","open","high","low","close","volume","close_time"])
            if len(d):
              d["open_time"]=pd.to_datetime(d["open_time"],unit="ms",utc=True)
              d["close_time"]=pd.to_datetime(d["close_time"],unit="ms",utc=True)
            d.to_csv(cache/f"futures_{sym}_5m.csv.gz",index=False,compression="gzip")
            print(f"{sym}: {len(d):,} candles across {len(days)} trade dates",flush=True)
          PY
      - name: Run trade-level forensic analysis
        run: |
          PYTHONPATH=. python scripts/loss_forensics_v3.py --trades data/trades_demo_aligned.csv --cache data/backtest_cache --out data/v3_loss_forensics
      - name: Upload forensic report
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trader-V3-Loss-Forensics
          path: data/v3_loss_forensics/
          retention-days: 30
          if-no-files-found: error
