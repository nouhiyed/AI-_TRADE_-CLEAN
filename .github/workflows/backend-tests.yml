name: Backend regression tests

on:
  pull_request:
    paths:
      - 'core/**'
      - 'agents/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'agents/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend and tests
        run: python -m compileall -q core agents api tests
      - name: Run backend regression suite
        run: python -m unittest discover -s tests -v
