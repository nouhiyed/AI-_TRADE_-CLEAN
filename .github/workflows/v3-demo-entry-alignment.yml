name: V3 DEMO Entry Alignment Research

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Comma-separated Futures symbols
        required: true
        default: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,LINKUSDT
  push:
    branches: [main]
    paths:
      - scripts/research_v3_demo_entry_alignment.py
      - tests/test_research_v3_demo_entry_alignment.py
      - .github/workflows/v3-demo-entry-alignment.yml

permissions:
  contents: read

concurrency:
  group: v3-demo-entry-alignment
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip "pandas>=2.2,<3" numpy requests ta pytest
      - name: Run research unit tests
        run: PYTHONPATH=. python -m pytest tests/test_research_v3_demo_entry_alignment.py -q
      - name: Download Binance Vision Futures 5m history
        env:
          SYMBOLS: \${{ github.event.inputs.symbols || 'BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,LINKUSDT' }}
        run: |
          python - <<'PY'
          import io, os, zipfile, time
          from datetime import timedelta
          from pathlib import Path
          import pandas as pd
          import requests

          start = pd.Timestamp("2024-11-16T00:00:00Z")
          end = pd.Timestamp.now(tz="UTC").floor("D")
          cache = Path("data/backtest_cache")
          cache.mkdir(parents=True, exist_ok=True)
          columns = ["open_time","open","high","low","close","volume","close_time",
                     "quote_volume","trades","taker_buy_base","taker_buy_quote","ignore"]
          session = requests.Session()
          session.headers["User-Agent"] = "AI-Trader-V3-DEMO-Alignment/1.0"

          def archive(symbol, period, cadence):
              stamp = str(period)
              url = (f"https://data.binance.vision/data/futures/um/{cadence}/klines/"
                     f"{symbol}/5m/{symbol}-5m-{stamp}.zip")
              last_error = None
              for attempt in range(5):
                  try:
                      response = session.get(url, timeout=90)
                      if response.status_code == 404:
                          raise RuntimeError(f"Missing archive: {url}")
                      if response.status_code in (418,429) or response.status_code >= 500:
                          time.sleep(min(30, 2 ** (attempt + 1)))
                          continue
                      response.raise_for_status()
                      with zipfile.ZipFile(io.BytesIO(response.content)) as zf:
                          name = next(n for n in zf.namelist() if n.lower().endswith(".csv"))
                          frame = pd.read_csv(zf.open(name), header=None)
                      if str(frame.iloc[0, 0]).lower() in ("open_time", "open time"):
                          frame = frame.iloc[1:].copy()
                      frame = frame.iloc[:, :12]
                      frame.columns = columns[:frame.shape[1]]
                      for col in ("open_time","close_time","open","high","low","close","volume"):
                          frame[col] = pd.to_numeric(frame[col], errors="coerce")
                      frame = frame.dropna(subset=["open_time","close_time","open","high","low","close","volume"])
                      return frame[["open_time","open","high","low","close","volume","close_time"]]
                  except RuntimeError:
                      raise
                  except Exception as exc:
                      last_error = exc
                      if attempt < 4:
                          time.sleep(min(30, 2 ** (attempt + 1)))
              raise RuntimeError(f"Archive download failed: {url}: {last_error}")

          first_month = start.to_period("M")
          current_month = end.to_period("M")
          months = pd.period_range(first_month, current_month - 1, freq="M")
          for symbol in [s.strip().upper() for s in os.environ["SYMBOLS"].split(",") if s.strip()]:
              parts = [archive(symbol, month, "monthly") for month in months]
              day = current_month.start_time.date()
              last_day = (end - pd.Timedelta(days=1)).date()
              while day <= last_day:
                  parts.append(archive(symbol, day, "daily"))
                  day += timedelta(days=1)
              frame = pd.concat(parts, ignore_index=True).drop_duplicates("open_time").sort_values("open_time")
              frame = frame[(frame.open_time >= start.timestamp()*1000) & (frame.open_time < end.timestamp()*1000)]
              frame["open_time"] = pd.to_datetime(frame["open_time"], unit="ms", utc=True)
              frame["close_time"] = pd.to_datetime(frame["close_time"], unit="ms", utc=True)
              path = cache / f"futures_{symbol}_5m.csv.gz"
              frame.to_csv(path, index=False, compression="gzip")
              print(f"{symbol}: {len(frame):,} candles", flush=True)
              if len(frame) < 100_000:
                  raise RuntimeError(f"Insufficient history for {symbol}: {len(frame)}")
          PY
      - name: Replay exact DEMO entry drift allowance
        run: |
          PYTHONPATH=. python scripts/research_v3_demo_entry_alignment.py \
            --symbols "\${{ github.event.inputs.symbols || 'BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,LINKUSDT' }}" \
            --out data/v3_demo_alignment
      - name: Upload DEMO-aligned research report
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trader-V3-DEMO-Entry-Alignment
          path: data/v3_demo_alignment/
          retention-days: 30
          if-no-files-found: error
