name: Research Candidate Store Tests

on:
  push:
    branches:
      - research/edge-engine-foundation
    paths:
      - "core/research_candidate_store.py"
      - "core/research_outcomes.py"
      - "core/research_features.py"
      - "tests/test_research_features.py"
      - "core/research_validation.py"
      - "scripts/research_evidence_report.py"
      - "core/coordinator.py"
      - "api/main.py"
      - "tests/test_research_candidate_store.py"
      - "tests/test_research_outcomes.py"
      - "tests/test_research_validation.py"
      - ".github/workflows/research-candidate-store.yml"
  workflow_dispatch:

jobs:
  candidate-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile research capture
        run: python -m py_compile core/research_candidate_store.py core/research_outcomes.py core/research_features.py core/research_validation.py core/coordinator.py api/main.py scripts/research_evidence_report.py
      - name: Run isolated candidate store tests
        run: python -m unittest discover -s tests -p 'test_research_candidate_store.py' -v
      - name: Run forward outcome tests
        run: python -m unittest discover -s tests -p 'test_research_outcomes.py' -v
      - name: Run walk-forward validation tests
        run: python -m unittest discover -s tests -p 'test_research_validation.py' -v
      - name: Run feature extraction tests
        run: python -m unittest discover -s tests -p 'test_research_features.py' -v
