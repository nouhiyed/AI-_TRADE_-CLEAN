name: V3 Relaxation Sweep (design / validation / sealed holdout)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backtest-v3-sweep.yml'
  workflow_dispatch:
    inputs:
      random_seeds:
        description: Number of random-entry control runs
        required: true
        default: '5'
      workers:
        description: Parallel symbol workers per job
        required: true
        default: '4'

permissions:
  contents: read

concurrency:
  group: v3-relaxation-sweep
  cancel-in-progress: true

env:
  SYMBOLS: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,LINKUSDT
  PYTHONUNBUFFERED: '1'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      end_date: ${{ steps.end.outputs.end_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Install dependencies (pandas below 3; the ta package predates pandas 3)"
        run: python -m pip install --upgrade pip "pandas>=2.2,<3" numpy requests ta
      - name: Fix the end date so every job uses the same history
        id: end
        run: echo "end_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Download 2 years of Futures 5m candles once
        env:
          END: ${{ steps.end.outputs.end_date }}
        run: |
          python - <<'PY'
          import io, os, zipfile
          from datetime import date, timedelta
          from pathlib import Path
          import pandas as pd
          import requests
          start = pd.Timestamp("2024-11-16T00:00:00Z")
          end = pd.Timestamp(os.environ["END"], tz="UTC")
          cache = Path("data/backtest_cache")
          cache.mkdir(parents=True, exist_ok=True)
          cols = ["open_time","open","high","low","close","volume","close_time",
                  "quote_volume","trades","taker_buy_base","taker_buy_quote","ignore"]
          session = requests.Session()
          session.headers["User-Agent"] = "AI-Trader-V3-Historical-Data/1.0"
          first_month = start.to_period("M")
          current_month = end.to_period("M")
          months = pd.period_range(first_month, current_month - 1, freq="M")
          for symbol in os.environ["SYMBOLS"].split(","):
              parts = []
              def load_archive(url):
                  response = session.get(url, timeout=90)
                  if response.status_code == 404:
                      raise RuntimeError(f"Binance Vision archive not found: {url}")
                  response.raise_for_status()
                  with zipfile.ZipFile(io.BytesIO(response.content)) as archive:
                      names = [n for n in archive.namelist() if n.lower().endswith(".csv")]
                      if not names:
                          raise RuntimeError(f"No CSV inside {url}")
                      frame = pd.read_csv(archive.open(names[0]), header=None)
                  if str(frame.iloc[0, 0]).lower() in ("open_time", "open time"):
                      frame = frame.iloc[1:].copy()
                  if frame.shape[1] < 7:
                      raise RuntimeError(f"Invalid kline CSV columns: {url}")
                  frame = frame.iloc[:, :12]
                  frame.columns = cols[:frame.shape[1]]
                  frame["open_time"] = pd.to_numeric(frame["open_time"], errors="coerce")
                  frame["close_time"] = pd.to_numeric(frame["close_time"], errors="coerce")
                  for col in ("open","high","low","close","volume"):
                      frame[col] = pd.to_numeric(frame[col], errors="coerce")
                  frame = frame.dropna(subset=["open_time","close_time","open","high","low","close","volume"])
                  parts.append(frame[["open_time","open","high","low","close","volume","close_time"]])
              for month in months:
                  stamp = str(month)
                  url = f"https://data.binance.vision/data/futures/um/monthly/klines/{symbol}/5m/{symbol}-5m-{stamp}.zip"
                  load_archive(url)
              day = current_month.start_time.date()
              last_day = (end - pd.Timedelta(days=1)).date()
              while day <= last_day:
                  stamp = day.isoformat()
                  url = f"https://data.binance.vision/data/futures/um/daily/klines/{symbol}/5m/{symbol}-5m-{stamp}.zip"
                  load_archive(url)
                  day += timedelta(days=1)
              frame = pd.concat(parts, ignore_index=True).drop_duplicates("open_time").sort_values("open_time")
              frame = frame[(frame.open_time >= start.timestamp()*1000) & (frame.open_time < end.timestamp()*1000)]
              frame["open_time"] = pd.to_datetime(frame["open_time"], unit="ms", utc=True)
              frame["close_time"] = pd.to_datetime(frame["close_time"], unit="ms", utc=True)
              frame.to_csv(cache / f"futures_{symbol}_5m.csv.gz", index=False, compression="gzip")
              print(f"{symbol}: {len(frame):,} candles from Binance Vision", flush=True)
              if len(frame) < 100_000:
                  raise RuntimeError(f"Insufficient 2-year history for {symbol}: {len(frame)} candles")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candle-cache
          path: data/backtest_cache/
          retention-days: 7
          if-no-files-found: error

  sweep:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        param:
          - PULLBACK_VOLUME
          - BREAKOUT_VOLUME
          - PULLBACK_CLOSE_LOCATION
          - BREAKOUT_CLOSE_LOCATION
          - PULLBACK_BODY_ATR
          - BREAKOUT_BODY_ATR
          - BREAKOUT_MAX_OPPOSING_WICK
          - RANDOM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip "pandas>=2.2,<3" numpy requests ta
      - uses: actions/download-artifact@v4
        with:
          name: candle-cache
          path: data/backtest_cache/
      - name: Run sweep
        env:
          PARAM: ${{ matrix.param }}
          END: ${{ needs.fetch.outputs.end_date }}
          WORKERS: ${{ github.event.inputs.workers || '4' }}
          SEEDS: ${{ github.event.inputs.random_seeds || '5' }}
        run: |
          if [ "$PARAM" = "RANDOM" ]; then
            EXTRA="--params none --random-baseline $SEEDS"
          else
            EXTRA="--params $PARAM"
          fi
          PYTHONPATH=. python scripts/sweep_v3.py --market futures --symbols "$SYMBOLS" \
            --end "$END" --workers "$WORKERS" --label "$PARAM" $EXTRA --out "sweep-out/$PARAM"
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.param }}
          path: sweep-out/
          retention-days: 30

  aggregate:
    needs: sweep
    if: always() && needs.sweep.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip "pandas>=2.2,<3" numpy requests ta
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-*
          path: all-results/
          merge-multiple: true
      - name: Combine all parameter sweeps into one multiple-testing-corrected report
        run: |
          PYTHONPATH=. python scripts/sweep_v3.py --aggregate all-results/*/ --out combined | tee combined-report.txt
          mkdir -p combined && cp combined-report.txt combined/
          cat combined/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Trader-V3-Sweep-Combined
          path: |
            combined/
            all-results/
          retention-days: 30
