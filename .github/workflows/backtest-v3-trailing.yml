name: V3 Trailing Take Profit Historical Backtest

on:
  push:
    branches: [main]
    paths:
      - 'scripts/backtest_scalping_v3_trailing.py'
      - 'tests/test_trailing_backtest.py'
      - 'core/trailing_stop.py'
      - 'core/scalping_v3.py'
      - '.github/workflows/backtest-v3-trailing.yml'
  workflow_dispatch:
    inputs:
      days:
        description: Historical window in days (minimum 30)
        required: true
        default: '730'

permissions:
  contents: read

concurrency:
  group: v3-trailing-historical-backtest
  cancel-in-progress: false

jobs:
  preflight-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DAYS: ${{ github.event.inputs.days || '730' }}
      MARKETS: spot,futures
      SYMBOLS: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,LINKUSDT
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned-compatible dependencies
        run: python -m pip install --upgrade pip pandas numpy requests ta
      - name: Compile all production and test Python modules
        run: |
          python -m compileall -q core agents scripts tests
          python -m py_compile scripts/backtest_scalping_v3_trailing.py tests/test_trailing_backtest.py
      - name: Run trailing-stop unit tests
        run: python tests/test_trailing_backtest.py
      - name: Run synthetic trailing lifecycle smoke test
        run: |
          python - <<'PY'
          import pandas as pd
          from core.trailing_stop import calculate_trailing_stop
          rows=[{"high":100+i*.2+.4,"low":100+i*.2-.3,"close":100+i*.2} for i in range(20)]
          frame=pd.DataFrame(rows)
          long=calculate_trailing_stop(frame,"LONG",99,102,103)
          short=calculate_trailing_stop(frame,"SHORT",105,100,99)
          assert long and long["stop"] >= 99
          assert short and short["stop"] <= 105
          print("PASS: LONG/SHORT trailing calculations and monotonic-stop guards")
          PY
      - name: Run two-year historical simulation with trailing exits
        run: python scripts/backtest_scalping_v3_trailing.py
      - name: Upload validated results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trader-V3-Trailing-Backtest
          path: backtest-trailing-results/
          if-no-files-found: error
          retention-days: 30
