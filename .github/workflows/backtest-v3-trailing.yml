name: V3 Live-Parity Historical Validation

on:
  workflow_dispatch:
    inputs:
      days:
        description: Historical window in days (minimum 30)
        required: true
        default: '730'

permissions:
  contents: read

concurrency:
  group: v3-trailing-historical-backtest
  cancel-in-progress: true

jobs:
  historical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DAYS: ${{ github.event.inputs.days || '730' }}
      MARKETS: spot,futures
      SYMBOLS: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,LINKUSDT
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install historical simulation dependencies
        run: python -m pip install --upgrade pip pandas numpy requests ta
      - name: Compile production strategy and validation engine
        run: python -m compileall -q core agents scripts
      - name: Verify Binance native 5m candle alignment and run 2-year V3 simulation
        run: python scripts/backtest_scalping_v3_trailing.py
      - name: Upload validated historical results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trader-V3-Live-Parity-Historical-Results
          path: backtest-trailing-results/
          if-no-files-found: error
          retention-days: 30
